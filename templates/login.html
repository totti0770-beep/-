{% extends 'base.html' %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <h2 class="text-2xl font-bold text-gray-900">بوابة تسجيل الدخول الآمن</h2>
            <p class="text-sm text-gray-500">الرجاء إدخال بياناتك التنفيذية للوصول للمنصة</p>
        </div>
        
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الرقم الوظيفي (Employee ID)</label>
                <input type="text" name="employee_id" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition" placeholder="مثال: JSH1001">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-3 rounded-lg transition shadow-md">دخول النظام</button>
        </form>
        
        <div class="text-center text-xs text-gray-400">
            مخصص لمنسوبي التمريض بمستشفى جازان التخصصي فقط.
        </div>
    </div>
</div>
{% endblock %}
